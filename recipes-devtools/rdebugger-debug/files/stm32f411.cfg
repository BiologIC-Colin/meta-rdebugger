# rdebugger: STM32F411RE (Cortex-M4F, 512 KB flash, 128 KB SRAM), e.g. on a
# NUCLEO-F411RE, through an ST-LINK (such as the Nucleo's on-board
# ST-LINK/V2-1, USB 0483:374b) using the "st-link" (dapdirect) driver
# (ST-LINK firmware V2J24 or later).
#
# GDB port (gdb_port from station.conf, default 3333):
#   3333  stm32f4x.cpu  Cortex-M4
#
# Pattern from OpenOCD's board/st_nucleo_f4.cfg, without its
# "reset_config srst_only": reset is OPENOCD_RESET_CONFIG in station.conf
# (empty = SYSRESETREQ over SWD). On a NUCLEO-64 the ST-LINK's NRST is wired
# to the target's NRST, so "srst_only srst_nogate" also works there.
# SWD clock: 2000 kHz requested from reset (an ST-LINK runs 1800); reset-init
# requests 8000, which an ST-LINK/V2-1 caps at 4000.

source [find interface/stlink.cfg]
transport select swd

set CHIPNAME stm32f4x
source [find target/stm32f4x.cfg]

# Zephyr thread awareness (the image needs CONFIG_DEBUG_THREAD_INFO=y).
$_TARGETNAME configure -rtos auto

# Resume on GDB detach so the firmware keeps running after a debug session.
$_TARGETNAME configure -event gdb-detach { resume }
