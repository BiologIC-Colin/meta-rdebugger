# rdebugger: STM32H747XI (Cortex-M7 + Cortex-M4, 2 MB dual-bank flash)
# through an ST-LINK using the "st-link" (dapdirect) driver.
#
# ST-LINK firmware: V2J24+ for dapdirect at all; V2J29 minimum, V2J32+
# recommended, for the M4 on AP3 and the APB-D on AP2 (the old HLA driver can
# only debug the M7).
#
# GDB ports (gdb_port from station.conf, default 3333):
#   3333  stm32h7x.cpu0  Cortex-M7
#   3334  stm32h7x.cpu1  Cortex-M4
# (the APB-AP mem_ap target "stm32h7x.ap2" gets no GDB port.)
#
# Pattern from OpenOCD's board/st_nucleo_h745zi.cfg.

source [find interface/stlink.cfg]
transport select swd

set CHIPNAME stm32h7x
set DUAL_CORE 1
# Cross-trigger interface: halting one core halts the other.
set USE_CTI 1
source [find target/stm32h7x_dual_bank.cfg]

# Zephyr thread awareness (the image needs CONFIG_DEBUG_THREAD_INFO=y).
$_CHIPNAME.cpu0 configure -rtos auto
$_CHIPNAME.cpu1 configure -rtos auto

# OpenOCD halts on GDB attach but does not resume on detach: resume, so the
# firmware keeps running after a debug session.
$_CHIPNAME.cpu0 configure -event gdb-detach { resume }
$_CHIPNAME.cpu1 configure -event gdb-detach { resume }
