# rdebugger: STM32F767ZI (Cortex-M7, 2 MB flash) through an ST-LINK using the
# "st-link" (dapdirect) driver (ST-LINK firmware V2J24 or later).
#
# GDB port (gdb_port from station.conf, default 3333):
#   3333  stm32f7x.cpu  Cortex-M7

source [find interface/stlink.cfg]
transport select swd

set CHIPNAME stm32f7x
source [find target/stm32f7x.cfg]

# Zephyr thread awareness (the image needs CONFIG_DEBUG_THREAD_INFO=y).
$_TARGETNAME configure -rtos auto

# Resume on GDB detach so the firmware keeps running after a debug session.
$_TARGETNAME configure -event gdb-detach { resume }
