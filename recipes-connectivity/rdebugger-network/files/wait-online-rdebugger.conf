# rdebugger: network-online.target = any one link that is RequiredForOnline is
# online (that is eth0: wlan0 and can0 are RequiredForOnline=no), giving up
# after 30 s instead of 120 s. Only used if a unit pulls in network-online.target.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
