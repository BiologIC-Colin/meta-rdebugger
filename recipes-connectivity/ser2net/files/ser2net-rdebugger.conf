# rdebugger: ser2net shares the DUT UART (/dev/dut-uart). Its configuration is
# generated by rdebugger-setup into /run from station.conf.
[Unit]
ConditionFileNotEmpty=
ConditionFileNotEmpty=/run/rdebugger/ser2net.yaml
After=rdebugger-setup.service network.target

[Service]
ExecStart=
# -n foreground, -u no UUCP lock files (not writable for a dynamic user)
ExecStart=/usr/sbin/ser2net -n -u -c /run/rdebugger/ser2net.yaml
DynamicUser=yes
# USB-UART nodes are group dialout
SupplementaryGroups=dialout
Restart=on-failure
RestartSec=5
