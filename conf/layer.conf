# meta-rdebugger: remote debug station (bench node) distro, machine and image.

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rdebugger"
BBFILE_PATTERN_rdebugger = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdebugger = "10"

LAYERVERSION_rdebugger = "1"
LAYERDEPENDS_rdebugger = "core raspberrypi openembedded-layer"
LAYERSERIES_COMPAT_rdebugger = "wrynose"
