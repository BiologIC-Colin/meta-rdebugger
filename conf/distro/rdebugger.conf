# rdebugger distribution: headless bench node / remote debug station.
#
# Policy only - hardware lives in conf/machine/, image content in
# recipes-core/images/. Standalone: does not require poky.conf.
#
# Note on precedence: configuration fragments (OE_FRAGMENTS in toolcfg.conf)
# are parsed *before* this file, so a hard "X = ..." here overrides a
# fragment. Use ?=, += or :append for anything a fragment may also set, and
# never hard-assign EXTRA_IMAGE_FEATURES here.

# --- Identity --------------------------------------------------------------
DISTRO = "rdebugger"
DISTRO_NAME = "rdebugger"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "wrynose"
MAINTAINER = "Colin Barker <colin.barker@biologic-tech.com>"

# Vendor part of the toolchain tuple: aarch64-rdebugger-linux
TARGET_VENDOR = "-rdebugger"

# --- Init system -----------------------------------------------------------
# systemd: socket/udev-driven services (OpenOCD starts when the probe is
# plugged in), systemd-networkd for eth0/wlan0/can0, journald, watchdog.
# This also adds the systemd and usrmerge DISTRO_FEATURES.
INIT_MANAGER = "systemd"

# Logs go to the journal only (no busybox syslogd).
VIRTUAL-RUNTIME_base-utils-syslog = ""

# Persistent /var/log so the journal survives a reboot or watchdog reset
# (OE default puts /var/log on tmpfs). journald size is capped in
# rdebugger-base. /tmp stays on tmpfs.
FILESYSTEM_PERMS_TABLES = "files/fs-perms.txt files/fs-perms-volatile-tmp.txt"

# No static /etc/hostname in the image: rdebugger-setup derives a unique
# name (rdebugger-<CM4 serial>) at first boot, or uses STATION_NAME.
hostname:pn-base-files = ""

# --- Packaging -------------------------------------------------------------
PACKAGE_CLASSES = "package_ipk"

# --- Features --------------------------------------------------------------
# Start from OE-Core's DISTRO_FEATURES_DEFAULTS and opt out of what a
# headless bench node does not need. Kept: acl ext2 ipv4 ipv6 ldconfig pci
# seccomp vfat wifi xattr zeroconf (+ systemd usrmerge from INIT_MANAGER).
#   zeroconf - avahi mDNS (<station>.local); also makes systemd-resolved
#              leave mDNS/LLMNR to avahi
#   vfat     - FAT boot partition holds the provisioning files
#   3g, nfc  - opted out, otherwise ofono and neard get pulled in
DISTRO_FEATURES_OPTED_OUT = " \
    x11 wayland opengl vulkan \
    pulseaudio alsa \
    bluetooth 3g nfc \
    nfs debuginfod ptest multiarch \
    gobject-introspection-data \
"

# --- Licences --------------------------------------------------------------
# The CM4 Wi-Fi firmware (linux-firmware-rpidistro) carries the Synaptics
# licence flag; the whole recipe is flagged.
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# --- Build behaviour -------------------------------------------------------
# Hash equivalence: better sstate reuse; site.conf configures the DB.
BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"
