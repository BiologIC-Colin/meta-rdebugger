#@TYPE: Machine
#@NAME: Raspberry Pi CM4 on Waveshare Compute Module 4 PoE 4G Board (64-bit)
#@DESCRIPTION: CM4 (eMMC, Wi-Fi) on the Waveshare CM4-POE-4G-BOARD, the first
#@DESCRIPTION: rdebugger carrier. Derived from raspberrypi4-64. Board reference:
#@DESCRIPTION: https://www.waveshare.com/wiki/Compute_Module_4_PoE_4G_Board

# Keep every raspberrypi4-64 / raspberrypi4 / rpi override (kernel defconfig
# bcm2711_defconfig, rpi4-nvmem.cfg, rpi-eeprom ...) and add our own machine
# name on top: MACHINEOVERRIDES = rpi:raspberrypi4:raspberrypi4-64:waveshare-cm4-poe-4g
MACHINEOVERRIDES =. "raspberrypi4-64:"
require conf/machine/raspberrypi4-64.conf

# Only the CM4 device tree (raspberrypi4-64.conf hard-assigns, so set it after
# the require).
RPI_KERNEL_DEVICETREE = "broadcom/bcm2711-rpi-cm4.dtb"

# Bluetooth is not used: dtoverlay=disable-bt (below) gives the full PL011
# UART (ttyAMA0) to GPIO14/15, which the board wires (jumper block J1) to its
# CP2102 "USB TO UART" Type-C port.
SERIAL_CONSOLES = "115200;ttyAMA0"
MACHINE_FEATURES_OPTED_OUT:append = " bluetooth"
MACHINE_EXTRA_RRECOMMENDS:remove = " \
    bluez-firmware-rpidistro-bcm4345c0-hcd \
    bluez-firmware-rpidistro-bcm4345c5-hcd \
"

# --- config.txt (rpi-config) -------------------------------------------------
# Serial console on GPIO14/15 (CP2102 "USB TO UART" port), 115200 8N1.
ENABLE_UART = "1"
# The board's USB 2.0 hub (USB-A ports, M.2 4G) hangs off the CM4's DWC2
# controller, which must be put in host mode - without this the ST-LINK and
# the FTDI do not enumerate. (otg_mode=1/XHCI does not work with this board's
# hub: "hub doesn't have any ports".) Note: while a computer is connected to
# the "USB SLAVE" Type-C, the CM4 USB is switched to that port (rpiboot) and
# the hub is disconnected.
ENABLE_DWC2_HOST = "1"
# MCP2515 on SPI0 CE0: 16 MHz crystal, INT on GPIO25 (meta-raspberrypi
# defaults CAN_OSCILLATOR / CAN0_INTERRUPT_PIN match the board).
ENABLE_SPI_BUS = "1"
ENABLE_CAN = "1"
# Isolated I2C1 (GPIO2/3), ADS1113 ADC at 0x48.
ENABLE_I2C = "1"
DISABLE_SPLASH = "1"
# Do NOT use ENABLE_W1: it hard-codes GPIO4, which is the RS232 TXD (uart3).

# 1-Wire master: w1-gpio on a free GPIO. The board has NO 40-pin header;
# GPIO use (schematic): 0/1 ID EEPROM, 2/3 isolated I2C1 (ADS1113), 4/5 RS232
# (uart3), 6 M.2 power, 7 unconnected (SPI0 CE1), 8-11 SPI0 (MCP2515),
# 12/13 RS485 (uart5, auto-direction), 14/15 console (CP2102), 16 RTC INT,
# 17/27 isolated OUT1/OUT2, 20/26 user LEDs green/red (active-low),
# 22 buzzer (active-low), 23/24 isolated IN1/IN2, 25 CAN INT.
# Only GPIO18 (pad P4), GPIO19 (pad P7) and GPIO21 (pad P8) are free, each on
# a bare single-pin test pad (raw 3.3 V, not isolated, no ESD protection).
# GPIO19 = pad P7 = CM4 connector pin 26. Needs an external 4.7k pull-up to
# 3.3 V. (A DS2482 on the isolated I2C1 terminal is the alternative.)
RDEBUGGER_W1_GPIO ?= "19"

# Appended verbatim to config.txt (via printf: \n separates lines, no '%').
#   disable-bt          PL011 to GPIO14/15, no Bluetooth
#   i2c_vc + i2c-rtc    PCF85063A RTC on I2C-10 (i2c_csi_dsi)
#   uart3 / uart5       isolated RS232 (ttyAMA3) / RS485 (ttyAMA5)
#   w1-gpio             1-Wire master
RPI_EXTRA_CONFIG = "\
# rdebugger: Waveshare CM4-POE-4G board\n\
dtoverlay=disable-bt\n\
dtparam=i2c_vc=on\n\
dtoverlay=i2c-rtc,pcf85063a,i2c_csi_dsi\n\
dtoverlay=uart3\n\
dtoverlay=uart5\n\
dtoverlay=w1-gpio,gpiopin=${RDEBUGGER_W1_GPIO}\n\
"

# Tidy cmdline.txt (an unset CMA option leaves a double space).
CMDLINE_CMA = ""

# --- Kernel modules and firmware the board needs ---------------------------
# The rdebugger image is built from packagegroup-core-boot, not
# packagegroup-base, so MACHINE_EXTRA_RRECOMMENDS (incl. rpi's catch-all
# "kernel-modules") is not installed. packagegroup-core-boot does install
# MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS, so the board's drivers go here. They
# load on demand from the device tree.
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    kernel-module-mcp251x \
    kernel-module-spi-bcm2835 \
    kernel-module-i2c-dev \
    kernel-module-i2c-mux \
    kernel-module-i2c-mux-pinctrl \
    kernel-module-rtc-pcf85063 \
    kernel-module-w1-gpio \
    kernel-module-brcmfmac \
    kernel-module-brcmfmac-cyw \
    linux-firmware-rpidistro-bcm43455 \
"

# i2c-dev has no device to trigger it.
KERNEL_MODULE_AUTOLOAD += "i2c-dev"
